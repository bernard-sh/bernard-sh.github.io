<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #ffe4e1;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            overflow: hidden;
        }

        h1 {
            color: #d02090;
            font-size: 3rem;
            margin-bottom: 20px;
        }

        .buttons {
            display: flex;
            gap: 20px;
            position: relative;
            width: 100%;
            justify-content: center;
            align-items: center;
        }

        button {
            padding: 15px 30px;
            font-size: 1.5rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        #yesBtn {
            background-color: #ff69b4;
            color: white;
        }

        #noBtn {
            background-color: #a9a9a9;
            color: white;
            position: absolute;
        }

        .celebration {
            display: none;
            font-size: 2rem;
            color: #d02090;
        }
    </style>
</head>
<body>
    <div id="main-content">
        <h1>Vika Anggari</h1>
        <h1>Will you be my Valentine?</h1>
        <h1>❤️</h1>
        <div class="buttons">
            <row>
                <column>
                    <button id="yesBtn" onclick="celebrate()">Yes</button>
                </column>
                <column>
                    <button id="noBtn">No</button>
                </column>
            </row>
        </div>
    </div>

    <div id="celebration" class="celebration">
        <h1>Yay! I knew you'd say yes! 🌹✨</h1>
        <img src="muah.gif">
        <p>Best Valentine's ever!</p>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const mainContent = document.getElementById('main-content');
        const celebration = document.getElementById('celebration');

        // Function to move the "No" button to a random spot
        function moveButton() {
            // Get random coordinates within the window
            // Subtracting button dimensions so it stays on screen
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);

            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;
            noBtn.style.position = 'fixed';
        }

        // Move on both mouse hover AND click (just in case they're fast!)
        noBtn.addEventListener('mouseover', moveButton);
        noBtn.addEventListener('click', moveButton);

        function celebrate() {
            mainContent.style.display = 'none';
            celebration.style.display = 'block';
            document.body.style.backgroundColor = '#fff0f5';
        }
    </script>
</body>
</html>
